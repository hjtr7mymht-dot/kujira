appId: dev.mythzx.kujira
productName: Kujira
copyright: Copyright © 2026 Myth Zx

directories:
  output: dist
  buildResources: resources

# native deps (node-hid, peasyo-sdl-lib) ship multi-platform prebuilds in-package
npmRebuild: false

files:
  - from: .
    filter:
      - package.json
      - app
publish:
- github


# Mac OS configuration
mac:
  category: public.app-category.games
  # icon: "src/app/assets/images/icon.icns"
  target: 
  - target: dmg
    arch: 
    - universal

# Config for OSX dmg
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

# Windows configuration
win:
  icon: "resources/icon.ico"
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  target:
    - "zip"
    - "nsis"

# Config for the windows installer
nsis:
  oneClick: true
  perMachine: true
  artifactName: "${productName}-${version}-win-${arch}-setup.${ext}"

# Linux configuration
linux:
  category: Game
  target:
    - "AppImage"
    - "deb"