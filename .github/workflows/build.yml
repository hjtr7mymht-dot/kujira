name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: kujira-win-x64
          - os: macos-latest
            args: --mac --universal
            artifact: kujira-mac-universal
          - os: ubuntu-latest
            args: --linux
            artifact: kujira-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux native-dep headers (node-hid source-build fallback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Install dependencies
        # same resolution mode as local dev — HeroUI's peer range conflicts
        # trip npm ci's strict ERESOLVE check on a clean tree
        run: npm install --legacy-peer-deps

      - name: Dump npm diagnostics
        if: failure()
        shell: bash
        run: |
          echo '## npm install diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo 'node: ' $(node -v) ' npm: ' $(npm -v) >> "$GITHUB_STEP_SUMMARY"
          ls -t ~/.npm/_logs/*.log 2>/dev/null | head -1 | xargs -I{} tail -60 {} >> "$GITHUB_STEP_SUMMARY" || echo 'no npm logs' >> "$GITHUB_STEP_SUMMARY" 

      - name: Build renderer and main
        shell: bash
        # nextron's internal electron-builder initializes the GitHub publisher
        # (the yml carries a publish section) and throws without GH_TOKEN on CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo '::error title=nextron build failed::see the ::error:: lines below for the tail of build.log'
            tail -25 build.log | sed 's/\r//' | sed 's/^/::error::/' | head -25
            exit 1
          }

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/latest*.yml
            !dist/**/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/latest*.yml
